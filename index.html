<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialApp — Facebook Style Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{background:#f0f2f5}.nav{box-shadow:0 1px 3px #0002}.hide{display:none}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px #0001}
.tab.active{color:#1877f2;border-bottom:3px solid #1877f2}
@media(min-width:900px){.mobile-nav{display:none}.desktop-layout{display:grid;grid-template-columns:240px minmax(400px,680px) 260px;gap:18px;max-width:1200px;margin:auto}}
@media(max-width:899px){.desktop-only{display:none}.desktop-layout{max-width:680px;margin:auto}}
</style>
</head>
<body class="text-gray-800">

<header class="nav bg-white sticky top-0 z-40">
<div class="max-w-6xl mx-auto px-3 h-14 flex items-center gap-3">
<button onclick="go('home')" class="text-2xl font-bold text-blue-600">SocialApp</button>
<div class="flex-1 max-w-sm bg-gray-100 rounded-full px-4 py-2"><i class="fa fa-search"></i> <input class="bg-transparent outline-none w-4/5" placeholder="Search"></div>
<div class="flex gap-2">
<button onclick="go('home')" class="p-3 rounded-full hover:bg-gray-100"><i class="fa fa-house"></i></button>
<button onclick="go('reels')" class="p-3 rounded-full hover:bg-gray-100"><i class="fa fa-clapperboard"></i></button>
<button onclick="go('friends')" class="p-3 rounded-full hover:bg-gray-100"><i class="fa fa-user-group"></i></button>
<button onclick="go('messenger')" class="p-3 w-full text-left">💬 Messenger</button><button onclick="go('notifications')" class="p-3 rounded-full hover:bg-gray-100 relative"><i class="fa fa-bell"></i><b id="badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-xs rounded-full px-1.5">3</b></button>
<button onclick="go('menu')" class="p-3 rounded-full hover:bg-gray-100"><i class="fa fa-bars"></i></button>
</div>
</div>
</header>

<main class="desktop-layout p-3 pb-20">
<aside class="desktop-only space-y-2">
<div class="card p-4 font-semibold">👤 Md Sojib</div>
<button onclick="go('friends')" class="card p-3 w-full text-left">👥 Friends</button>
<button onclick="go('reels')" class="card p-3 w-full text-left">🎬 Reels</button>
<button onclick="go('notifications')" class="card p-3 w-full text-left">🔔 Notifications</button>
<button onclick="go('menu')" class="card p-3 w-full text-left">☰ Menu</button>
</aside>

<section id="app" class="space-y-3"></section>

<aside class="desktop-only">
<div class="card p-4"><b>Contacts</b><p class="mt-3">🟢 Rahim</p><p>🟢 Karim</p><p>🟢 Sumaiya</p></div>
</aside>
</main>

<nav class="mobile-nav fixed bottom-0 left-0 right-0 bg-white border-t z-50 flex justify-around py-2">
<button onclick="go('home')" class="text-blue-600"><i class="fa fa-house block text-lg"></i>Home</button>
<button onclick="go('reels')"><i class="fa fa-clapperboard block text-lg"></i>Reels</button>
<button onclick="go('friends')"><i class="fa fa-user-group block text-lg"></i>Friends</button>
<button onclick="go('notifications')"><i class="fa fa-bell block text-lg"></i>Alerts</button>
<button onclick="go('menu')"><i class="fa fa-bars block text-lg"></i>Menu</button>
</nav>

<script>
const currentUserName = 'Md Sojib';

localStorage.setItem("currentUser", currentUserName);
function getNotifications(){ return JSON.parse(localStorage.getItem("socialNotifications")||"[]"); }
function addNotification(recipient,type,actor,postId,text){
  if(!recipient || recipient===actor) return;
  let ns=getNotifications();
  ns.unshift({id:Date.now()+Math.random(),recipient,type,actor,postId,text,read:false,createdAt:new Date().toISOString()});
  localStorage.setItem("socialNotifications",JSON.stringify(ns.slice(0,200)));
}
function unreadNotificationCount(){
  let me=localStorage.getItem("currentUser")||currentUserName;
  return getNotifications().filter(n=>n.recipient===me&&!n.read).length;
}
function markNotificationsRead(){
  let me=localStorage.getItem("currentUser")||currentUserName;
  localStorage.setItem("socialNotifications",JSON.stringify(getNotifications().map(n=>n.recipient===me?{...n,read:true}:n)));
  render("notifications");
}
function getMessages(){ return JSON.parse(localStorage.getItem("socialMessages")||"[]"); }
function saveMessages(ms){ localStorage.setItem("socialMessages",JSON.stringify(ms.slice(-500))); }
function chatUsers(){
  let me=localStorage.getItem("currentUser")||currentUserName, ms=getMessages(), names=new Set();
  ms.forEach(m=>{if(m.from===me)names.add(m.to);if(m.to===me)names.add(m.from);});
  return [...names];
}
function openChat(name){localStorage.setItem("activeChat",name);render("chat");}
function userAvatar(name, size="w-10 h-10"){
  let initials=String(name||"U").trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
  return `<div class="${size} rounded-full bg-gray-200 flex items-center justify-center font-bold text-gray-700 overflow-hidden">${escapeHtml(initials)}</div>`;
}
function messengerTopBar(){
  let me=localStorage.getItem("currentUser")||currentUserName, count=unreadNotificationCount();
  return `<div class="sticky top-0 z-30 bg-white border-b p-3 flex items-center justify-between">
    <div class="flex items-center gap-2"><span class="text-2xl font-bold">Messenger</span></div>
    <button onclick="go('messenger')" class="relative p-2 rounded-full hover:bg-gray-100">💬${count?`<span class="absolute -top-1 -right-1 bg-red-600 text-white text-xs rounded-full px-1.5">${count}</span>`:""}</button>
  </div>`;
}




function mediaComposer(){ return ""; }
function openCreateMediaPost(kind){
  let title={photo:"Photo Post",video:"Video Post",reel:"Create Reel",text:"Create Text Post"}[kind]||"Create Post";
  let accept={photo:"image/*",video:"video/*",reel:"video/*",text:""}[kind];
  let me=localStorage.getItem("currentUser")||currentUserName;
  document.getElementById("app").innerHTML=`<div class="card overflow-hidden">
    <div class="p-4 border-b flex items-center gap-3">
      <button onclick="go('home')" class="text-blue-600 text-xl">←</button>
      ${userAvatar(me,"w-10 h-10")}
      <div><h2 class="text-xl font-bold">${title}</h2><div class="text-xs text-gray-500">আপনার প্রোফাইল থেকে পোস্ট হবে</div></div>
    </div>
    <div class="p-4">
      <textarea id="newPostText" class="w-full border rounded-xl p-3 min-h-28" placeholder="${kind==="text"?"আপনার মনের কথা লিখুন...":"Caption / Description লিখুন..."}"></textarea>
      ${kind!=="text"?`<label class="block font-semibold mt-4">📎 ${kind==="photo"?"Photo নির্বাচন করুন":kind==="video"?"Video নির্বাচন করুন":"Reel Video নির্বাচন করুন"}</label>
      <input id="newPostFile" type="file" accept="${accept}" class="w-full border rounded-xl p-3 mt-2" onchange="previewNewPostMedia(event,'${kind}')">
      <div id="newPostPreview" class="mt-3"></div>`:""}
      <div class="mt-4">
        <label class="font-semibold">🌐 কে দেখতে পারবে?</label>
        <select id="newPostPrivacy" class="w-full border rounded-xl p-3 mt-2">
          <option value="Public">Public — সবাই দেখতে পারবে</option>
          <option value="Friends">Friends — শুধু বন্ধুরা</option>
          <option value="Only Me">Only Me — শুধু আমি</option>
        </select>
      </div>
      <button onclick="publishMediaPost('${kind}')" class="w-full bg-blue-600 text-white rounded-xl p-3 mt-5 font-semibold">Post</button>
    </div>
  </div>`;
}
function previewNewPostMedia(event,kind){
  let f=event.target.files?.[0], box=document.getElementById("newPostPreview"); if(!f||!box)return;
  let url=URL.createObjectURL(f);
  box.innerHTML=kind==="photo"?`<img src="${url}" class="w-full max-h-80 object-cover rounded-xl">`:`<video src="${url}" controls class="w-full max-h-80 rounded-xl"></video>`;
}
function publishMediaPost(kind){
  let me=localStorage.getItem("currentUser")||currentUserName;
  let text=document.getElementById("newPostText")?.value.trim()||"";
  let file=document.getElementById("newPostFile")?.files?.[0];
  if(kind!=="text"&&!file)return alert("এই পোস্টের জন্য ফাইল নির্বাচন করুন।");
  if(kind==="text"&&!text)return alert("Text লিখুন।");
  let p={
    id:Date.now(), user:me, text:text, likes:0, comments:0, shares:0,
    mediaType:kind, mediaName:file?file.name:"", privacy:document.getElementById("newPostPrivacy")?.value||"Public",
    img:""
  };
  posts.unshift(p);
  localStorage.setItem("socialPosts",JSON.stringify(posts));
  alert(kind==="reel"?"Reel পোস্ট হয়েছে ✅":kind==="photo"?"Photo পোস্ট হয়েছে ✅":kind==="video"?"Video পোস্ট হয়েছে ✅":"Text পোস্ট হয়েছে ✅");
  go("profile");
}

function messengerPage(){
  let me=localStorage.getItem("currentUser")||currentUserName, names=chatUsers(), ms=getMessages();
  return `${messengerTopBar()}<div class="grid md:grid-cols-3 gap-4 p-4">
    <div class="card p-4 md:col-span-2">
      <div class="flex justify-between items-center"><h2 class="text-2xl font-bold">💬 Chats</h2><button onclick="startNewChat()" class="bg-blue-600 text-white rounded-lg px-4 py-2">＋ New Message</button></div>
      <input id="messageSearch" oninput="filterChats()" class="w-full border rounded-xl p-3 mt-4" placeholder="🔎 Search people or conversations">
      <div id="chatList" class="mt-4 space-y-2">${names.length?names.map(n=>{let last=ms.filter(m=>(m.from===me&&m.to===n)||(m.from===n&&m.to===me)).slice(-1)[0];return `<button data-name="${escapeHtml(n)}" onclick="openChat('${encodeURIComponent(n)}')" class="w-full text-left border rounded-xl p-3 hover:bg-gray-50 flex items-center gap-3">${userAvatar(n)}<div class="flex-1"><div class="flex justify-between"><b>${escapeHtml(n)}</b><span class="text-xs text-gray-500">${last?new Date(last.time).toLocaleTimeString():""}</span></div><div class="text-sm text-gray-500 truncate">${last?escapeHtml(last.text||"📎 Attachment"):"Start a conversation"}</div></div></button>`}).join(""):`<div class="text-center text-gray-500 py-10">কোনো conversation নেই।<br><button onclick="startNewChat()" class="text-blue-600 mt-2">New Message শুরু করুন</button></div>`}</div>
    </div>
    <div class="card p-4"><h3 class="font-bold mb-3">👥 People</h3><div class="space-y-2">${["Rahim","Karim","Nadia","Sadia"].map(n=>`<button onclick="openChat('${encodeURIComponent(n)}')" class="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-gray-100">${userAvatar(n,"w-9 h-9")}<span>${n}</span><span class="ml-auto text-green-600 text-xs">●</span></button>`).join("")}</div></div>
  </div>`;
}
function filterChats(){let q=(document.getElementById("messageSearch")?.value||"").toLowerCase();document.querySelectorAll("#chatList [data-name]").forEach(x=>x.style.display=x.dataset.name.toLowerCase().includes(q)?"block":"none");}
function startNewChat(){let n=prompt("যাকে Messenger করতে চান তার নাম লিখুন:");if(!n||!n.trim())return;let me=localStorage.getItem("currentUser")||currentUserName;if(n.trim().toLowerCase()===me.toLowerCase())return alert("নিজেকে Messenger করা যাবে না।");openChat(n.trim());}
function chatPage(){
  let me=localStorage.getItem("currentUser")||currentUserName, other=decodeURIComponent(localStorage.getItem("activeChat")||"");
  if(!other)return messengerPage();
  let ms=getMessages().filter(m=>(m.from===me&&m.to===other)||(m.from===other&&m.to===me));
  let all=getMessages().map(m=>(m.from===other&&m.to===me)?{...m,seen:true}:m);saveMessages(all);
  let body=ms.map(m=>`<div class="flex ${m.from===me?"justify-end":""}"><div class="max-w-xs md:max-w-md rounded-2xl px-4 py-2 mb-2 ${m.from===me?"bg-blue-600 text-white":"bg-gray-100"}">${m.text?`<div>${escapeHtml(m.text)}</div>`:""}${m.fileName?`<div class="text-xs mt-1">📎 ${escapeHtml(m.fileName)}</div>`:""}<div class="text-[10px] opacity-70 mt-1">${new Date(m.time).toLocaleTimeString()} · ${m.from===me?(m.seen?"Seen":"Sent"):""}</div></div></div>`).join("");
  return `<div class="card overflow-hidden"><div class="p-4 border-b flex items-center gap-3"><button onclick="go('messenger')" class="text-blue-600">←</button><div><b>${escapeHtml(other)}</b><div class="text-xs text-green-600">● Active chat</div></div></div><div class="p-4 h-96 overflow-y-auto bg-gray-50">${body||'<div class="text-center text-gray-500 mt-20">Say hello 👋</div>'}</div><div class="p-3 border-t"><div class="flex gap-2"><input id="chatInput" onkeydown="if(event.key==='Enter')sendMessage()" class="flex-1 border rounded-xl p-3" placeholder="Message..."><input id="chatFile" type="file" class="hidden" onchange="sendChatFile()"><button onclick="document.getElementById('chatFile').click()" class="border rounded-xl px-3">📎</button><button onclick="sendMessage()" class="bg-blue-600 text-white rounded-xl px-5">Send</button></div></div></div>`;
}
function sendMessage(){let me=localStorage.getItem("currentUser")||currentUserName,other=decodeURIComponent(localStorage.getItem("activeChat")||""),input=document.getElementById("chatInput"),text=input?.value.trim();if(!other||!text)return;let ms=getMessages();ms.push({id:Date.now(),from:me,to:other,text,time:new Date().toISOString(),seen:false});saveMessages(ms);addNotification(other,"message",me,null,"sent you a message.");input.value="";render("chat");}
function sendChatFile(){let me=localStorage.getItem("currentUser")||currentUserName,other=decodeURIComponent(localStorage.getItem("activeChat")||""),f=document.getElementById("chatFile")?.files?.[0];if(!f||!other)return;let ms=getMessages();ms.push({id:Date.now(),from:me,to:other,text:"",fileName:f.name,fileType:f.type,time:new Date().toISOString(),seen:false});saveMessages(ms);addNotification(other,"message",me,null,"sent you a file.");render("chat");}

function notificationsPage(){
  let me=localStorage.getItem("currentUser")||currentUserName;
  let ns=getNotifications().filter(n=>n.recipient===me);
  return `<div class="card p-5"><button onclick="go('home')" class="text-blue-600 mb-3">← Home</button>
  <div class="flex justify-between items-center"><h2 class="text-2xl font-bold">🔔 Notifications ${unreadNotificationCount()?`<span class="text-sm bg-red-600 text-white rounded-full px-2">${unreadNotificationCount()}</span>`:""}</h2>
  ${ns.length?`<button onclick="markNotificationsRead()" class="text-sm text-blue-600">Mark all as read</button>`:""}</div>
  <div class="mt-5 space-y-2">${ns.length?ns.map(n=>`<div class="border rounded-xl p-4 ${n.read?"":"bg-blue-50"}"><b>${escapeHtml(n.actor)}</b> ${escapeHtml(n.text||"") }<div class="text-xs text-gray-500 mt-1">${new Date(n.createdAt).toLocaleString()}</div></div>`).join(""):`<p class="text-gray-500">কোনো Notification নেই।</p>`}</div></div>`;
}

function canReportUser(owner){ return String(owner||'').trim().toLowerCase() !== currentUserName.toLowerCase(); }

const posts=[
 {id:1,user:"Rahim",text:"আজকের দিনটা দারুণ! সবাই কেমন আছেন?",likes:24,comments:5,img:"https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900"},
 {id:2,user:"Sumaiya",text:"নতুন একটি সুন্দর মুহূর্ত শেয়ার করলাম ❤️",likes:41,comments:8,img:"https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=900"}
];
function go(page){render(page)}
function render(page="home"){
 const a=document.getElementById("app");
 if(page==="home") a.innerHTML=home();
 if(page==="reels") a.innerHTML=reels();
 if(page==="friends") a.innerHTML=friends();
 if(page==="notifications") a.innerHTML=notifications();
 if(page==="profile") a.innerHTML=profile();
 if(page==="menu") a.innerHTML=menu();
 if(page==="settings") a.innerHTML=settings();
 if(page==="dashboard") a.innerHTML=dashboard();
 if(page==="gallery") a.innerHTML=gallery();
 if(page==="about") a.innerHTML=about();
 if(page==="profileFriends") a.innerHTML=profileFriends();
 if(page==="photos") a.innerHTML=photos();
 if(page==="profileReels") a.innerHTML=profileReels();
 if(page==="editProfile") a.innerHTML=editProfile();
 if(page==="account") a.innerHTML=account();
 if(page==="password") a.innerHTML=passwordSecurity();
 if(page==="devices") a.innerHTML=devices();
 if(page==="twofa") a.innerHTML=twoFA();
 if(page==="blocked") a.innerHTML=blockedUsers();
 if(page==="language") a.innerHTML=languageSettings();
 if(page==="delete") a.innerHTML=deleteAccount();
  if(page==="help") a.innerHTML=helpSupport();
  if(page==="identity") a.innerHTML=identityVerification();
  if(page==="sendfile") a.innerHTML=sendFile();
 if(page==="login") a.innerHTML=loginPage();
 if(page==="pages") a.innerHTML=pages();
 if(page==="createPage") a.innerHTML=createPage();
  if(page==="supportHome") a.innerHTML=supportHome();
  if(page==="supportChat") a.innerHTML=supportChat();
  if(page==="report") a.innerHTML=reportPage();
 if(page==="pageView") a.innerHTML=pageView();
 window.scrollTo(0,0);
}
function home(){return `<div class="card p-4">
<div class="flex items-center justify-between mb-4"><div class="font-bold text-lg">Home</div><div class="flex gap-3 text-gray-600"><button onclick="go('notifications')">🔔</button><button onclick="go('menu')">☰</button></div></div>
<div class="flex gap-3"><div class="w-11 h-11 rounded-full bg-blue-500 text-white grid place-items-center">S</div><input id="newPost" class="flex-1 bg-gray-100 rounded-full px-4" placeholder="আপনি কী ভাবছেন?"><button onclick="addPost()" class="bg-blue-600 text-white px-4 rounded-full">Post</button></div>
<div class="flex justify-around mt-4 text-sm border-t pt-3"><button onclick="createContent('photo')">📷 Photo</button><button onclick="createContent('video')">🎥 Video</button><button onclick="createContent('reel')">🎬 Reel</button><button onclick="createContent('text')">📝 Text</button></div></div>
<div class="card p-4 mt-3"><div class="font-bold mb-3">Stories</div><div class="flex gap-3 overflow-x-auto">${["Your Story","Rahim","Sumaiya","Karim","Nadia"].map((n,i)=>`<div class="min-w-[92px] h-36 rounded-xl bg-gradient-to-b from-blue-500 to-purple-600 text-white flex items-end p-2 font-semibold">${n}</div>`).join("")}</div></div>
<div class="card p-4 mt-3"><div class="font-bold mb-3">Public Feed</div>${posts.map(post).join("")}</div>`}
function pages(){let ps=JSON.parse(localStorage.getItem("socialPages")||"[]");return `<div class="card p-5"><button onclick="go('menu')" class="text-blue-600 mb-3">← Menu</button><div class="flex items-center justify-between"><h2 class="text-xl font-bold">📄 Pages</h2><button onclick="go('createPage')" class="bg-blue-600 text-white rounded-lg px-4 py-2">+ Create Page</button></div><input id="pageSearch" oninput="filterPages()" class="w-full border rounded-lg p-3 mt-5" placeholder="🔍 Search Pages"><div id="pagesList" class="space-y-3 mt-5">${ps.length?ps.map((p,i)=>pageCard(p,i)).join(""):`<div class="text-center p-8 text-gray-500">এখনও কোনো Page তৈরি করা হয়নি।</div>`}</div></div>`}
function pageCard(p,i){return `<div class="border rounded-xl p-4 flex items-center justify-between"><div><h3 class="font-bold">${p.name}</h3><p class="text-sm text-gray-500">${p.category}</p><p class="text-xs text-gray-500">${p.followers||0} Followers · ${p.likes||0} Likes</p></div><div class="flex gap-2"><button onclick="viewPage(${i})" class="bg-blue-600 text-white rounded-lg px-3 py-2">View</button><button onclick="followPage(${i})" class="bg-gray-100 rounded-lg px-3 py-2">Follow</button></div></div>`}
function createPage(){return `<div class="card p-5"><button onclick="go('pages')" class="text-blue-600 mb-3">← Pages</button><h2 class="text-xl font-bold">📄 Create a Page</h2><p class="text-gray-500 mt-1">Page-এর নাম, পরিচয় ও Category/Title নির্বাচন করুন।</p><div class="space-y-4 mt-5"><input id="pageName" class="w-full border rounded-lg p-3" placeholder="Page Name"><textarea id="pageIdentity" class="w-full border rounded-lg p-3" placeholder="Page Identity / পরিচয়"></textarea><select id="pageCategory" class="w-full border rounded-lg p-3"><option value="">Category / Title নির্বাচন করুন</option>${["Content Creator","Video Creator","Gaming","Shopping & Retail","Restaurant","Software / Technology","News & Media","Musician / Artist","Education","Business","Fitness","Travel","Photographer","Public Figure","Community","Entertainment","Sports","Other"].map(x=>`<option>${x}</option>`).join("")}</select><input id="pageAddress" class="w-full border rounded-lg p-3" placeholder="ঠিকানা"><input id="pageContact" class="w-full border rounded-lg p-3" placeholder="Website / Contact"><input id="pageAvatar" class="w-full border rounded-lg p-3" placeholder="Page Profile Photo URL"><input id="pageCover" class="w-full border rounded-lg p-3" placeholder="Page Cover Photo URL"><button onclick="savePage()" class="w-full bg-blue-600 text-white rounded-lg p-3">Create Page</button></div></div>`}
function savePage(){let n=document.getElementById("pageName").value.trim(),id=document.getElementById("pageIdentity").value.trim(),cat=document.getElementById("pageCategory").value;if(!n||!cat)return alert("Page Name এবং Category/Title নির্বাচন করুন।");let ps=JSON.parse(localStorage.getItem("socialPages")||"[]");ps.push({name:n,identity:id,category:cat,address:document.getElementById("pageAddress").value,contact:document.getElementById("pageContact").value,avatar:document.getElementById("pageAvatar").value,cover:document.getElementById("pageCover").value,followers:0,likes:0});localStorage.setItem("socialPages",JSON.stringify(ps));alert("Page তৈরি হয়েছে ✅");go("pages")}
function viewPage(i){localStorage.setItem("selectedPage",i);go("pageView")}

function addPost(){let x=document.getElementById("newPost").value.trim();if(!x)return;posts.unshift({id:Date.now(),user:"Md Sojib",text:x,likes:0,comments:0,img:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=900"});render("home")}
function deletePost(id){if(confirm("নিজের পোস্টটি ডিলেট করবেন?")){let i=posts.findIndex(x=>x.id===id);if(i>=0)posts.splice(i,1);render("home")}}
function like(id){
  let p=posts.find(x=>x.id===id); if(!p)return;
  p.likes=(p.likes||0)+1;
  let actor=localStorage.getItem("currentUser")||currentUserName;
  if(p.user!==actor) addNotification(p.user,"like",actor,id,"liked your post.");
  render("home");
}
function comment(id){
  let p=posts.find(x=>x.id===id); if(!p)return;
  let c=prompt("আপনার কমেন্ট লিখুন"); if(!c || !c.trim())return;
  p.comments=(p.comments||0)+1;
  let actor=localStorage.getItem("currentUser")||currentUserName;
  if(p.user!==actor) addNotification(p.user,"comment",actor,id,"commented on your post.");
  alert("Comment added");
  render("home");
}

  if(!q)return;
  let box=document.getElementById("supportMessages");
  box.insertAdjacentHTML("beforeend",`<div class="bg-blue-50 rounded-xl p-4 text-right"><b>You</b><p class="mt-1">${escapeHtml(q)}</p></div>`);
  input.value="";

  let lower=q.toLowerCase();
  let answer="আপনার সমস্যাটি বুঝতে আরও তথ্য লাগতে পারে। নিচের প্রাসঙ্গিক অপশনটি ব্যবহার করে এগিয়ে যান।";
  let target="supportHome";
  if(/password|পাসওয়ার্ড|পাসওয়ার্ড|login|লগইন/.test(lower)){answer="Password বা Login সমস্যা হলে Password & Security পেজে যান।";target="password";}
  else if(/gmail|email|ইমেইল|জিমেইল/.test(lower)){answer="Gmail/Email verification-এর জন্য Account Information পেজে যান।";target="account";}
  else if(/phone|mobile|নাম্বার|নম্বর|otp|ওটিপি/.test(lower)){answer="Phone/OTP সমস্যার জন্য Account Information পেজে যান।";target="account";}
  else if(/2fa|two.?factor|দুই ধাপ|টু.?ফ্যাক্টর/.test(lower)){answer="Two-Factor Authentication চালু বা পরিবর্তন করতে 2FA পেজে যান।";target="twofa";}
  else if(/id|nid|voter|passport|পরিচয়|পরিচয়/.test(lower)){answer="পরিচয় যাচাইয়ের জন্য Identity Verification পেজে যান।";target="identity";}
  else if(/file|ফাইল|send file|সেন্ড ফাইল/.test(lower)){answer="File পাঠানোর জন্য Send File পেজে যান।";target="sendFile";}

  box.insertAdjacentHTML("beforeend",`<div class="bg-gray-100 rounded-xl p-4"><b>Gemini Support</b><p class="mt-1">${answer}</p><button onclick="supportNavigate('${target}')" class="mt-3 bg-blue-600 text-white rounded-lg px-3 py-2">Go to related page</button></div>`);
  box.scrollTop=box.scrollHeight;
}

function supportNavigate(target){
  // These routes are kept separate so existing pages are not replaced.
  if(target==="identity"){
    if(typeof identityVerification==="function") return go("identity");
    return alert("Identity Verification pageটি পরের backend/API integration-এর জন্য প্রস্তুত করা হবে।");
  }
  if(target==="sendFile"){
    if(typeof sendFilePage==="function") return go("sendFile");
    return alert("Send File pageটি আপনার existing file-transfer system-এর সঙ্গে যুক্ত করার জন্য রাখা হয়েছে।");
  }
  if(target==="supportChat") return go("supportChat");
  go(target);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}


function openReport(type,targetId,targetName){
  let owner = decodeURIComponent(String(targetName||""));
  if(type==="profile" && !canReportUser(owner)){
    alert("নিজের Profile নিজে Report করা যাবে না। অন্যের Profile Report করতে পারবেন।");
    return;
  }
  localStorage.setItem("reportTarget",JSON.stringify({
    type:type,targetId:String(targetId),targetName:decodeURIComponent(String(targetName||""))
  }));
  go("report");
}

function reportOtherProfile(){
  let name=prompt("যে অন্য ব্যক্তির Profile Report করতে চান তার নাম লিখুন:");
  if(!name || !name.trim()) return;
  if(!canReportUser(name)){
    alert("নিজের Profile নিজে Report করা যাবে না। অন্যের Profile-এর নাম দিন।");
    return;
  }
  openReport("profile",name.trim(),encodeURIComponent(name.trim()));
}

function reportPage(){
  let t=JSON.parse(localStorage.getItem("reportTarget")||'{"type":"profile","targetId":"","targetName":""}');
  let label=t.type==="profile"?"Profile":t.type==="comment"?"Comment":t.type==="video"?"Video":"Post";
  return `<div class="card p-5">
    <button onclick="go('home')" class="text-blue-600 mb-3">← Back</button>
    <div id="reportStepContent">${reportStep1()}</div>
  </div>`;
}

function reportStep1(){
  let t=JSON.parse(localStorage.getItem("reportTarget")||'{"type":"profile","targetId":"","targetName":""}');
  let label=t.type==="profile"?"Profile":t.type==="comment"?"Comment":t.type==="video"?"Video":"Post";
  let cats=["Harassment / Bullying","Hate Speech","Threat / Violence","Scam / Fraud","Spam","Fake Account / Impersonation","Nudity / Sexual Content","Child Safety","Copyright","False / Misleading Information","Other"];
  return `<h2 class="text-2xl font-bold">🚩 Report ${label}</h2>
    <p class="text-gray-500 mt-1">অন্যের Profile/Post/Comment/Video-এর সমস্যা রিপোর্ট করুন। নিজের content নিজে Report করা যাবে না।</p>
    <div class="border rounded-xl p-4 mt-5 bg-gray-50"><p class="text-sm text-gray-500">যাকে/যেটিকে রিপোর্ট করছেন</p><b>${escapeHtml(t.targetName||label)}</b></div>
    <label class="block font-semibold mt-5">1. কী সমস্যার কারণে আপনি রিপোর্ট করছেন?</label>
    <div class="grid gap-2 mt-3">
      ${cats.map((c,i)=>`<button onclick="selectReportReason(${i},'${encodeURIComponent(c)}')" class="border rounded-xl p-3 text-left hover:bg-gray-50"><span class="mr-2">○</span>${c}</button>`).join("")}
    </div>
    <div class="border border-yellow-200 bg-yellow-50 rounded-xl p-4 mt-5 text-sm">🔒 Password, OTP, Backup Code বা সম্পূর্ণ NID/Passport নম্বর দেবেন না।</div>`;
}

function selectReportReason(index, encoded){
  localStorage.setItem("reportReason",decodeURIComponent(encoded));
  document.getElementById("reportStepContent").innerHTML=reportStep2();
}

function reportStep2(){
  let reason=localStorage.getItem("reportReason")||"";
  let questions={
    "Harassment / Bullying":"আপনাকে বা অন্য কাউকে কীভাবে হয়রানি/বুলিং করা হয়েছে?",
    "Hate Speech":"কী ধরনের ঘৃণামূলক বা অপমানজনক বক্তব্য রয়েছে?",
    "Threat / Violence":"কী ধরনের হুমকি বা সহিংসতার সমস্যা হয়েছে?",
    "Scam / Fraud":"কীভাবে প্রতারণা বা স্ক্যামের সঙ্গে জড়িত?",
    "Spam":"কী ধরনের Spam বা unwanted content দেখেছেন?",
    "Fake Account / Impersonation":"এই Profile/Account কীভাবে ভুয়া বা অন্যের পরিচয় ব্যবহার করছে?",
    "Nudity / Sexual Content":"কোন ধরনের inappropriate sexual content সমস্যা হয়েছে?",
    "Child Safety":"শিশু/কিশোরের নিরাপত্তা নিয়ে কী সমস্যা হয়েছে?",
    "Copyright":"আপনার Copyright-এর কোন বিষয়টি ব্যবহার করা হয়েছে?",
    "False / Misleading Information":"কোন তথ্যটি ভুল বা বিভ্রান্তিকর মনে হয়েছে?",
    "Other":"অন্যান্য কী সমস্যা হয়েছে?"
  };
  let q=questions[reason]||questions.Other;
  return `<button onclick="document.getElementById('reportStepContent').innerHTML=reportStep1()" class="text-blue-600 mb-3">← Back</button>
    <h2 class="text-xl font-bold">Report Details</h2>
    <p class="text-gray-500 mt-1">কারণ: <b>${escapeHtml(reason)}</b></p>
    <label class="block font-semibold mt-5">2. ${escapeHtml(q)}</label>
    <textarea id="reportDetails" class="w-full border rounded-lg p-3 mt-2 min-h-36" placeholder="আপনার সমস্যাটি বিস্তারিত লিখুন..."></textarea>

    <label class="block font-semibold mt-5">3. আরও কোনো তথ্য দিতে চান?</label>
    <textarea id="reportExtra" class="w-full border rounded-lg p-3 mt-2 min-h-24" placeholder="প্রয়োজনে অতিরিক্ত তথ্য লিখুন..."></textarea>

    <label class="block font-semibold mt-5">4. 📸 Screenshot / Evidence যুক্ত করুন</label>
    <input id="reportScreenshots" type="file" accept="image/*" multiple onchange="previewReportScreenshots(event)" class="w-full border rounded-lg p-3 mt-2">
    <div id="reportPreview" class="grid grid-cols-2 gap-2 mt-3"></div>

    <button onclick="reportStep3()" class="w-full bg-blue-600 text-white rounded-xl p-3 mt-5 font-semibold">Continue → Review Report</button>
    <div class="border border-yellow-200 bg-yellow-50 rounded-xl p-4 mt-4 text-sm">🔒 Screenshot-এ Password, OTP, Backup Code বা সম্পূর্ণ ID নম্বর থাকলে তা সরিয়ে দিন।</div>`;
}

function reportStep3(){
  let details=document.getElementById("reportDetails")?.value.trim()||"";
  let extra=document.getElementById("reportExtra")?.value.trim()||"";
  let files=[...(document.getElementById("reportScreenshots")?.files||[])];
  if(!details)return alert("আপনার সমস্যাটি বিস্তারিত লিখুন।");
  localStorage.setItem("reportDetails",details);
  localStorage.setItem("reportExtra",extra);
  localStorage.setItem("reportScreenshotCount",Math.min(files.length,5));
  document.getElementById("reportStepContent").innerHTML=reportStep4();
}

function reportStep4(){
  let t=JSON.parse(localStorage.getItem("reportTarget")||"{}");
  let reason=localStorage.getItem("reportReason")||"";
  let details=localStorage.getItem("reportDetails")||"";
  let extra=localStorage.getItem("reportExtra")||"";
  let count=Number(localStorage.getItem("reportScreenshotCount")||0);
  let label=t.type==="profile"?"Profile":t.type==="comment"?"Comment":t.type==="video"?"Video":"Post";
  return `<button onclick="document.getElementById('reportStepContent').innerHTML=reportStep2()" class="text-blue-600 mb-3">← Back</button>
    <h2 class="text-xl font-bold">🔎 Review Your Report</h2>
    <p class="text-gray-500 mt-1">Submit করার আগে তথ্যগুলো দেখে নিন।</p>
    <div class="space-y-3 mt-5">
      <div class="border rounded-xl p-4"><span class="text-gray-500">Reported:</span><br><b>${escapeHtml(t.targetName||label)}</b></div>
      <div class="border rounded-xl p-4"><span class="text-gray-500">Type:</span><br><b>${label}</b></div>
      <div class="border rounded-xl p-4"><span class="text-gray-500">Problem:</span><br><b>${escapeHtml(reason)}</b></div>
      <div class="border rounded-xl p-4"><span class="text-gray-500">Your details:</span><br>${escapeHtml(details)}</div>
      ${extra?`<div class="border rounded-xl p-4"><span class="text-gray-500">Additional information:</span><br>${escapeHtml(extra)}</div>`:""}
      <div class="border rounded-xl p-4"><span class="text-gray-500">Screenshots:</span><br><b>${count} attached</b></div>
    </div>
    <button onclick="submitReport()" class="w-full bg-red-600 text-white rounded-xl p-3 mt-5 font-semibold">🚩 Submit Report</button>`;
}

function submitReport(){
  let category=localStorage.getItem("reportReason")||"";
  let details=localStorage.getItem("reportDetails")||"";
  let extra=localStorage.getItem("reportExtra")||"";
  let count=Number(localStorage.getItem("reportScreenshotCount")||0);
  let reports=JSON.parse(localStorage.getItem("socialReports")||"[]");
  let target=JSON.parse(localStorage.getItem("reportTarget")||"{}");
  reports.push({
    id:Date.now(), targetType:target.type||"unknown", targetId:target.targetId||"",
    category, details, extra, screenshotCount:count, createdAt:new Date().toISOString(), status:"Pending"
  });
  localStorage.setItem("socialReports",JSON.stringify(reports));
  if(target.targetName){
    let actor=localStorage.getItem("currentUser")||currentUserName;
    let reportedOwner=decodeURIComponent(String(target.targetName||""));
    if(reportedOwner && reportedOwner!==actor) addNotification(reportedOwner,"report",actor,target.targetId,"your content/profile has been reported and is pending review.");
  }
  ["reportTarget","reportReason","reportDetails","reportExtra","reportScreenshotCount"].forEach(k=>localStorage.removeItem(k));
  document.getElementById("app").innerHTML=`<div class="card p-6 text-center">
    <div class="text-5xl">✅</div><h2 class="text-xl font-bold mt-3">Report Submitted</h2>
    <p class="text-gray-600 mt-2">আপনার রিপোর্ট গ্রহণ করা হয়েছে। আমাদের moderation team এটি পর্যালোচনা করবে।</p>
    <button onclick="go('home')" class="mt-5 bg-blue-600 text-white rounded-lg px-5 py-3">Go Home</button>
  </div>`;
}

function savePost(id){
  let saved=JSON.parse(localStorage.getItem("savedPosts")||"[]");
  if(!saved.includes(id)) saved.push(id);
  localStorage.setItem("savedPosts",JSON.stringify(saved));
  alert("Post saved");
}

function postMore(id){
  let p=posts.find(x=>x.id===id);
  if(!p)return;
  if(!canReportUser(p.user)){
    alert("নিজের Post নিজে Report করা যাবে না। অন্যের Post Report করতে পারবেন।");
    return;
  }
  openReport("post",id,encodeURIComponent(p.user));
}

function sharePost(id){
  let p=posts.find(x=>x.id===id); if(!p)return;
  p.shares=(p.shares||0)+1;
  let actor=localStorage.getItem("currentUser")||currentUserName;
  if(p.user!==actor) addNotification(p.user,"share",actor,id,"shared your post.");
  if(navigator.share){
    navigator.share({title:"SocialApp Post",text:p.text||"SocialApp Post"}).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(location.href+"#post-"+id);
    alert("Post link copied. Share করা যাবে।");
  }
  render("home");
}

render("home");
</script>
</body>
</html>
